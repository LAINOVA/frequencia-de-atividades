<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAINOVA - Painel de Atividades</title>
    
    <!-- Bibliotecas Externas (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden h-screen flex">

<div id="app" v-cloak class="w-full h-full relative">

    <!-- Container de Notificações Toast -->
    <toast-container :toasts="toasts" @fechar="removerToast"></toast-container>

    <!-- Modal de Confirmação Global -->
    <modal-confirmacao 
        :aberto="modalConfirmacao.aberto"
        :titulo="modalConfirmacao.titulo"
        :mensagem="modalConfirmacao.mensagem"
        :texto-botao="modalConfirmacao.textoBotao"
        :perigoso="modalConfirmacao.perigoso"
        :carregando="modalConfirmacao.carregando"
        @confirmar="executarConfirmacao"
        @cancelar="fecharConfirmacao">
    </modal-confirmacao>

    <!-- Modal de Alteração de Senha / Primeiro Acesso -->
    <modal-alterar-senha
        :modal-aberto="modalSenhaAberto"
        :primeiro-acesso="primeiroAcessoObrigatorio"
        :enviando="enviandoSenha"
        @fechar="modalSenhaAberto = false"
        @salvar-senha="salvarAlteracaoSenha">
    </modal-alterar-senha>

    <!-- Modal de Redefinição de Senha de Membro (Master Admin) -->
    <modal-admin-reset-senha
        :modal-aberto="modalAdminResetAberto"
        :membro="membroResetSelecionado"
        :enviando="enviandoAdminReset"
        @fechar="modalAdminResetAberto = false"
        @salvar-reset="executarAdminResetSenha">
    </modal-admin-reset-senha>

    <!-- TELA DE LOGIN (Se não estiver autenticado) -->
    <login-view 
        v-if="!usuarioAutenticado" 
        :carregando-login="carregandoLogin" 
        :mensagem-erro="mensagemErroLogin"
        @fazer-login="fazerLogin">
    </login-view>

    <!-- PAINEL PRINCIPAL (Se estiver autenticado) -->
    <div v-else class="flex w-full h-full relative">
        
        <!-- Tela de Carregamento Global -->
        <div v-if="carregandoDados" class="carregando-overlay">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-600 mb-4"></i>
            <p>A sincronizar com a base de dados...</p>
        </div>

        <!-- MENU LATERAL (Filtrado por Cargo) -->
        <app-sidebar 
            :abas="abas" 
            :aba-atual="abaAtual" 
            :menu-mobile-aberto="menuMobileAberto"
            :cargo-usuario="usuarioAtual.cargo"
            @mudar-aba="mudarAba" 
            @fechar-menu="menuMobileAberto = false"
            @fazer-logout="fazerLogout">
        </app-sidebar>

        <!-- ÁREA PRINCIPAL -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
            
            <!-- CABEÇALHO -->
            <app-header 
                :titulo-aba-atual="tituloAbaAtual" 
                :hora-formatada="horaFormatada" 
                :data-formatada="dataFormatada"
                :usuario="usuarioAtual"
                @abrir-menu="menuMobileAberto = true"
                @abrir-alterar-senha="modalSenhaAberto = true"
                @fazer-logout="fazerLogout">
            </app-header>

            <!-- CONTAINER DE TELAS -->
            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                
                <!-- TELA 1: DASHBOARD -->
                <dashboard-view 
                    v-if="abaAtual === 'dashboard'"
                    :membros="membros" 
                    :acumulado-membros="acumuladoMembros"
                    :total-horas-geral="totalHorasGeral"
                    :total-lancamentos="totalLancamentos"
                    :cargo-usuario="usuarioAtual.cargo">
                </dashboard-view>

                <!-- TELA 2: REGISTAR HORAS (Individual ou Em Lote) -->
                <registrar-view 
                    v-if="abaAtual === 'registrar'"
                    :projetos="projetos"
                    :categorias="categorias"
                    :membros="membros"
                    :form="form"
                    :duracao-calculada-horas="duracaoCalculadaHoras"
                    :enviando-registro="enviandoRegistro"
                    :timer-ativo="timerAtivo"
                    :cronometro-display="cronometroDisplay"
                    :usuario="usuarioAtual"
                    @salvar-registro="salvarRegistro"
                    @salvar-registro-lote="salvarRegistroLote"
                    @iniciar-cronometro="iniciarCronometro"
                    @parar-cronometro="pararCronometro">
                </registrar-view>

                <!-- TELA 3: HISTÓRICO (Com Edição/Exclusão Individual e em Lote) -->
                <historico-view 
                    v-if="abaAtual === 'historico'"
                    :registros-ordenados="registros"
                    :formatar-data-sheet="formatarDataSheet"
                    :cargo-usuario="usuarioAtual.cargo"
                    :membros="membros"
                    :filtro-membro="filtroMembroHist"
                    :paginacao="paginacao"
                    :pode-editar-excluir="usuarioAtual.cargo === 'ADMINISTRADOR_MASTER' || usuarioAtual.cargo === 'ADMINISTRADOR' || usuarioAtual.cargo === 'GESTOR'"
                    @mudar-filtro-membro="mudarFiltroMembroHist"
                    @ir-pagina="irParaPagina"
                    @abrir-edicao="abrirModalEdicao"
                    @excluir-registro="excluirRegistroConfirmado"
                    @abrir-edicao-lote="abrirModalEdicaoLote"
                    @excluir-lote="excluirLoteConfirmado">
                </historico-view>

                <!-- TELA 4: GRÁFICOS & ANÁLISES (Master/Admin/Gestor) -->
                <graficos-view 
                    v-if="abaAtual === 'graficos' && usuarioAtual.cargo !== 'MEMBRO' && usuarioAtual.cargo !== 'MEMBRO_COMUM' && usuarioAtual.cargo !== 'FUNCIONARIO'"
                    :registros="todosRegistros.length > 0 ? todosRegistros : registros"
                    :periodo-grafico="periodoGrafico"
                    :usuario="usuarioAtual"
                    @mudar-periodo="periodoGrafico = $event">
                </graficos-view>

                <!-- TELA 5: PROJETOS & CATEGORIAS (Master/Admin/Gestor) -->
                <projetos-categorias-view 
                    v-if="abaAtual === 'projetos_categorias' && usuarioAtual.cargo !== 'MEMBRO' && usuarioAtual.cargo !== 'MEMBRO_COMUM' && usuarioAtual.cargo !== 'FUNCIONARIO'"
                    :projetos="projetos"
                    :categorias="categorias"
                    :carregando="carregandoItemLista"
                    @adicionar-projeto="adicionarProjeto"
                    @excluir-projeto="excluirProjeto"
                    @adicionar-categoria="adicionarCategoria"
                    @excluir-categoria="excluirCategoria">
                </projetos-categorias-view>

                <!-- TELA 6: GERADOR DE RELATÓRIOS (Master/Admin/Gestor) -->
                <relatorios-view 
                    v-if="abaAtual === 'relatorios' && usuarioAtual.cargo !== 'MEMBRO' && usuarioAtual.cargo !== 'MEMBRO_COMUM' && usuarioAtual.cargo !== 'FUNCIONARIO'"
                    :membros="membros"
                    :filtro-relatorio="filtroRelatorio"
                    :periodo-relatorio-texto="periodoRelatorioTexto"
                    :kpis-relatorio="kpisRelatorio"
                    :ranking-relatorio="rankingRelatorio"
                    :registros-relatorio="registrosRelatorio"
                    :registros-relatorio-ordenados="registrosRelatorioOrdenados"
                    :formatar-data-sheet="formatarDataSheet"
                    :usuario="usuarioAtual"
                    @aplicar-filtro-rapido="aplicarFiltroRapido"
                    @exportar-csv="exportarCSV"
                    @imprimir-relatorio="imprimirRelatorio">
                </relatorios-view>

                <!-- TELA 7: GESTÃO DE MEMBROS (Master/Admin) -->
                <membros-view 
                    v-if="abaAtual === 'membros' && (usuarioAtual.cargo === 'PROPRIETARIO' || usuarioAtual.cargo === 'ADMINISTRADOR_MASTER' || usuarioAtual.cargo === 'ADMINISTRADOR')"
                    :membros="membros"
                    :usuario="usuarioAtual"
                    @abrir-modal="modalMembroAberto = true"
                    @alternar-status="alternarStatusMembro"
                    @remover-membro="removerMembro"
                    @abrir-reset-senha="abrirModalAdminReset">
                </membros-view>

            </div>
        </main>

        <!-- MODAL: CADASTRAR MEMBRO -->
        <modal-membro 
            v-if="usuarioAtual.cargo === 'PROPRIETARIO' || usuarioAtual.cargo === 'ADMINISTRADOR_MASTER' || usuarioAtual.cargo === 'ADMINISTRADOR'"
            :modal-membro-aberto="modalMembroAberto"
            :enviando-membro="enviandoMembro"
            :usuario="usuarioAtual"
            @fechar-modal="modalMembroAberto = false"
            @salvar-membro="salvarMembro">
        </modal-membro>

        <!-- MODAL: EDITAR REGISTRO INDIVIDUAL -->
        <modal-editar-registro
            :modal-aberto="modalEdicaoAberto"
            :registro="registroParaEdicao"
            :projetos="projetos"
            :categorias="categorias"
            :enviando="enviandoEdicao"
            @fechar="modalEdicaoAberto = false"
            @salvar-edicao="salvarEdicaoRegistro">
        </modal-editar-registro>

        <!-- MODAL: EDITAR REGISTROS EM LOTE -->
        <modal-editar-lote
            :modal-aberto="modalEdicaoLoteAberto"
            :ids-selecionados="idsParaEdicaoLote"
            :projetos="projetos"
            :categorias="categorias"
            :enviando="enviandoEdicaoLote"
            @fechar="modalEdicaoLoteAberto = false"
            @salvar-edicao-lote="salvarEdicaoLote">
        </modal-editar-lote>

    </div>

</div>

<!-- Scripts Carregados Sequencialmente -->
<script src="js/config.js"></script>
<script src="js/components/ToastContainer.js"></script>
<script src="js/components/ModalConfirmacao.js"></script>
<script src="js/components/ModalAlterarSenha.js"></script>
<script src="js/components/ModalAdminResetSenha.js"></script>
<script src="js/components/LoginView.js"></script>
<script src="js/components/Sidebar.js"></script>
<script src="js/components/Header.js"></script>
<script src="js/components/DashboardView.js"></script>
<script src="js/components/GraficosView.js"></script>
<script src="js/components/ProjetosCategoriasView.js"></script>
<script src="js/components/RegistrarView.js"></script>
<script src="js/components/MembrosView.js"></script>
<script src="js/components/HistoricoView.js"></script>
<script src="js/components/RelatoriosView.js"></script>
<script src="js/components/ModalMembro.js"></script>
<script src="js/components/ModalEditarRegistro.js"></script>
<script src="js/components/ModalEditarLote.js"></script>
<script src="js/app.js"></script>
</body>
</html>
